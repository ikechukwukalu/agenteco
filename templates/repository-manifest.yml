# Agent Eco Space repository manifest
schema_version: 3

governance:
  repository: https://github.com/ikechukwukalu/agenteco
  version_or_commit: "<VERSION_OR_COMMIT>"

product:
  name: "<PRODUCT_NAME>"
  context_repository: "<CONTEXT_REPOSITORY_URL_OR_PATH>"

component:
  name: "<APPLICATION_OR_COMPONENT_NAME>"
  purpose: "<COMPONENT_PURPOSE>"

repository:
  name: "<REPOSITORY_NAME>"
  url_or_path: "<REPOSITORY_URL_OR_PATH>"
  type: "<frontend|backend|mobile|microservice|package|sdk|infrastructure|other>"
  visibility: "<private|internal|public>"
  default_specialist: "<SPECIALIST_NAME>"
  verified_revision: "<COMMIT_OR_VERSION>"

delivery:
  work_mode: "<Application|Package>"
  operating_profile: "<Lite|Standard|Enterprise>"
  topology: "<TOPOLOGY_OR_NOT_APPLICABLE>"
  permanent_branches:
    test: "<BRANCH_OR_NOT_APPLICABLE>"
    staging: "<BRANCH_OR_NOT_APPLICABLE>"
    production: "<BRANCH_OR_NOT_APPLICABLE>"

adapters:
  template_version: "<VERSION_OR_COMMIT>"
  agents_md:
    path: "AGENTS.md"
    required: <true|false>
    status: "<present|missing|stale|drifted|conflicting>"
    canonical_fingerprint: "<FINGERPRINT_OR_NONE>"
    local_fingerprint: "<FINGERPRINT_OR_NONE>"
  claude_md:
    path: "CLAUDE.md"
    required: <true|false>
    status: "<present|missing|stale|drifted|conflicting>"
    canonical_fingerprint: "<FINGERPRINT_OR_NONE>"
    local_fingerprint: "<FINGERPRINT_OR_NONE>"
  copilot_instructions:
    path: ".github/copilot-instructions.md"
    required: <true|false>
    status: "<present|missing|stale|drifted|conflicting>"
    canonical_fingerprint: "<FINGERPRINT_OR_NONE>"
    local_fingerprint: "<FINGERPRINT_OR_NONE>"
  gemini_md:
    path: "GEMINI.md"
    required: <true|false>
    status: "<present|missing|stale|drifted|conflicting>"
    canonical_fingerprint: "<FINGERPRINT_OR_NONE>"
    local_fingerprint: "<FINGERPRINT_OR_NONE>"
  deepseek:
    path: "<PATH_OR_NONE>"
    required: <true|false>
    mode: "<native-auto-loaded|client-managed|manual-bootstrap|not-used>"
    host_client: "<CLIENT_NAME_OR_NONE>"
    instruction_path: "<PATH_OR_NONE>"
    status: "<verified|missing|stale|drifted|conflicting|not-used>"
    canonical_fingerprint: "<FINGERPRINT_OR_NONE>"
    local_fingerprint: "<FINGERPRINT_OR_NONE>"
    last_verified_at: "<ISO_8601_OR_NONE>"
  last_validated_revision: "<COMMIT_OR_NONE>"
  last_reconciled_at: "<ISO_8601_OR_NONE>"
  reconciliation_history: "<PATH_OR_NONE>"

context:
  repository_directory: "<CENTRAL_CONTEXT_DIRECTORY>"
  last_synchronized_revision: "<COMMIT_OR_NONE>"
  pending_outbox_items: 0
  ecosystem_intake:
    status: "<complete|partial|missing|stale>"
    completed_at: "<ISO_8601_OR_NONE>"
    context_revision: "<COMMIT_OR_NONE>"
    repository_revisions_reviewed: {}
    coverage_gaps: []
    refresh_interval_days: 14
    next_reminder_at: "<ISO_8601_OR_NONE>"
  connected_repositories:
    producers: []
    consumers: []
    other_dependencies: []
    last_verified_at: "<ISO_8601_OR_NONE>"

documentation:
  feature_documentation:
    tool: "<TOOL_OR_NONE>"
    version: "<VERSION_OR_NONE>"
    source_paths: []
    validation_command: "<COMMAND_OR_NONE>"
    output_or_publication: "<PATH_URL_OR_NONE>"
  api_documentation:
    tool: "<SCRIBE_OPENAPI_SWAGGER_OTHER_OR_NONE>"
    version: "<VERSION_OR_NONE>"
    config_paths: []
    source_paths: []
    generation_or_validation_command: "<COMMAND_OR_NONE>"
    output_or_publication: "<PATH_URL_OR_NONE>"
  changelog:
    path: "<CHANGELOG_PATH_OR_MISSING>"
    format: "<FORMAT_OR_UNKNOWN>"
    last_verified_revision: "<COMMIT_OR_NONE>"

governance_integrity:
  checker_path: ".agenteco/check-agenteco-adapters.py"
  command: "python3 .agenteco/check-agenteco-adapters.py"
  ci_enforced: <true|false>
  last_passed_at: "<ISO_8601_OR_NONE>"
