name: Governance version

on:
  pull_request:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version increase
        run: python3 tools/check_governance_version.py "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
